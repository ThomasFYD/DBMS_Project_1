{% extends "base.html" %}

{% block title %}{% if form.instance.pk %}Update School{% else %}Create School{% endif %}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>{% if form.instance.pk %}Update School{% else %}Create School{% endif %}</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-success">{% if form.instance.pk %}Save Changes{% else %}Add School{% endif %}</button>
        <a href="{% url 'school_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
