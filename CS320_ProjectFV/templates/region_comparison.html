{% extends "base.html" %}

{% block title %}Region Comparison{% endblock %}

{% block extra_head %}
    <style>
        body {
            background-color: #f8f9fa;
        }
        .comparison-section {
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        h2, h3 {
            color: #343a40;
        }
        .form-check-label {
            font-weight: normal;
        }
        .comparison-chart {
            display: none;
            margin-top: 2rem;
        }
    </style>
{% endblock %}

{% block content %}
<div class="container mt-4 comparison-section">
    <h2>Region Comparison</h2>
    <div class="row">
        <div class="col-md-6">
            <h3>Region One</h3>
            <select name="region_1" id="region_1" class="form-select mb-3" required></select>
        </div>
        <div class="col-md-6">
            <h3>Region Two</h3>
            <select name="region_2" id="region_2" class="form-select mb-3" required></select>
        </div>
    </div>

    <!-- Comparison Options -->
    <form id="comparison-form" method="post" class="mt-4">
        {% csrf_token %}
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="fields" value="school_enrollment" id="enrollment">
            <label class="form-check-label" for="enrollment">Enrollment</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="fields" value="percent_gifted_student" id="gifted">
            <label class="form-check-label" for="gifted">% Gifted Students</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="fields" value="low_income_percentage" id="low_income_percentage">
            <label class="form-check-label" for="low_income_percentage">Low Income Percentage</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="fields" value="teacher_loan_cancellations" id="teacher_loan_cancellations">
            <label class="form-check-label" for="teacher_loan_cancellations">Teacher Loan Cancellations</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="fields" value="percent_students_low_income" id="percent_students_low_income">
            <label class="form-check-label" for="percent_students_low_income">% Students Low Income</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="fields" value="test_scores" id="test_scores">
            <label class="form-check-label" for="test_scores">Test Scores</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="fields" value="dropout_rate" id="dropout_rate">
            <label class="form-check-label" for="dropout_rate">Dropout Rate</label>
        </div>

        <button type="submit" class="btn btn-primary">Compare</button>
    </form>

    <!-- Display Comparison Chart -->
    <img id="comparison-chart" src="" alt="Comparison Chart" class="img-fluid comparison-chart" style="display: none">
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    // Load available regions into the dropdowns
    var regions = {{ regions|safe }};
    $('#region_1, #region_2').empty().prop('disabled', false);
    $.each(regions, function(key, value) {
        $('#region_1, #region_2').append('<option value="' + value + '">' + value + '</option>');
    });

    // 表单提交处理
    $('#comparison-form').on('submit', function(event) {
        event.preventDefault();

        var region1 = $('#region_1').val();
        var region2 = $('#region_2').val();
        var fields = $('input[name="fields"]:checked').map(function() {
            return this.value;
        }).get();

        if (!region1 || !region2 || fields.length === 0) {
            alert("Please select two regions and at least one field to compare.");
            return;
        }

        var formData = JSON.stringify({
            regions: {
                region_1: region1,
                region_2: region2
            },
            fields: fields
        });

        $.ajax({
            url: '{% url "region_comparison" %}',
            type: 'POST',
            headers: {'X-CSRFToken': '{{ csrf_token }}'},
            contentType: 'application/json',
            data: formData,
            success: function(response) {
                if (response.comparison_image) {
                    $('#comparison-chart').attr('src', response.comparison_image);
                    $('#comparison-chart').show();
                }
                if (response.selected_fields) {
                    console.log("Selected Fields:", response.selected_fields);
                }
            },
            error: function(jqXHR, textStatus, errorThrown) {
                console.error("Failed to submit the form", jqXHR.responseJSON ? jqXHR.responseJSON.error : textStatus);
            }
        });
    });
});
</script>
{% endblock %}
